name: Sync noticias

on:
  schedule:
    # Cada 15 minutos (GitHub usa UTC). El mínimo permitido es 5 min.
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-noticias
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Scrapear portal → Aiven
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: server

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependencias
        run: npm ci --omit=dev

      - name: Conectar Cloudflare WARP (IP de consumidor)
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools resolvconf curl
          curl -fsSL -o /usr/local/bin/wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.22/wgcf_2.2.22_linux_amd64
          chmod +x /usr/local/bin/wgcf
          wgcf register --accept-tos
          wgcf generate
          sudo mkdir -p /etc/wireguard
          sudo cp wgcf-profile.conf /etc/wireguard/wgcf.conf
          sudo wg-quick up wgcf
          echo "── IP de salida ──"
          curl -s --max-time 15 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|warp|loc)=' || true

      - name: Sync scraper → Aiven
        env:
          DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL }}
          AIVEN_DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL }}
        run: npm run sync

      - name: Ping Render (mantiene despierto el backend)
        if: always()
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 https://uniguajira-news.onrender.com/api/health || true)
          echo "Render /api/health → HTTP $code"

      - name: Desconectar WARP
        if: always()
        run: sudo wg-quick down wgcf || true
